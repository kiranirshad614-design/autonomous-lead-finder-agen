<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDR Lead Finder Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        async function loadData() {
            try {
                const scoredLeadsRes = await fetch('audit_data/scored_leads.json');
                const scoredLeads = await scoredLeadsRes.json();
                
                const syncStatusRes = await fetch('audit_data/sync_status.json');
                const syncStatus = await syncStatusRes.json();

                // Update Metrics
                document.getElementById('total-leads').innerText = scoredLeads.all_scored.length;
                document.getElementById('hot-leads').innerText = scoredLeads.hot_leads.length;
                document.getElementById('gmail-status').innerText = syncStatus.gmail_sync_status;
                
                const statusColor = syncStatus.gmail_sync_status === 'Ready for Sync' ? 'text-green-600' : 'text-amber-600';
                document.getElementById('gmail-status').className = `text-2xl font-bold ${statusColor}`;

                // Populate Table
                const tableBody = document.getElementById('leads-table-body');
                scoredLeads.hot_leads.forEach(lead => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-900">${lead.company}</td>
                        <td class="px-6 py-4">${lead.dm}</td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
                                ${lead.lead_score}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500">${lead.location}</td>
                        <td class="px-6 py-4">
                            <a href="${lead.website}" target="_blank" class="text-blue-600 hover:underline">Visit Site</a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading dashboard data:', error);
            }
        }
        window.onload = loadData;
    </script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <nav class="bg-white border-b border-gray-200 fixed z-30 w-full">
        <div class="px-3 py-3 lg:px-5 lg:pl-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center justify-start">
                    <span class="text-xl font-bold flex items-center lg:ml-2.5">
                        <span class="self-center whitespace-nowrap text-blue-600">SDR Lead Finder</span>
                    </span>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-20 px-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
            <!-- Metric Card 1 -->
            <div class="bg-white shadow rounded-lg p-4 sm:p-6 xl:p-8">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-2xl sm:text-3xl leading-none font-bold text-gray-900" id="total-leads">0</span>
                        <h3 class="text-base font-normal text-gray-500">Total Leads Audited</h3>
                    </div>
                </div>
            </div>
            <!-- Metric Card 2 -->
            <div class="bg-white shadow rounded-lg p-4 sm:p-6 xl:p-8">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-2xl sm:text-3xl leading-none font-bold text-red-600" id="hot-leads">0</span>
                        <h3 class="text-base font-normal text-gray-500">Hot Leads (>80)</h3>
                    </div>
                </div>
            </div>
            <!-- Metric Card 3 -->
            <div class="bg-white shadow rounded-lg p-4 sm:p-6 xl:p-8">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <span class="text-2xl font-bold text-gray-900" id="gmail-status">Checking...</span>
                        <h3 class="text-base font-normal text-gray-500">Gmail Sync Status</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white shadow rounded-lg p-4 sm:p-6 xl:p-8">
            <div class="mb-4 flex items-center justify-between">
                <div>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">Hot Lead List</h3>
                    <span class="text-base font-normal text-gray-500">Leads prioritized for immediate outreach</span>
                </div>
            </div>
            <div class="flex flex-col mt-8">
                <div class="overflow-x-auto rounded-lg">
                    <div class="align-middle inline-block min-w-full">
                        <div class="shadow overflow-hidden sm:rounded-lg">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Company</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Score</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Link</th>
                                    </tr>
                                </thead>
                                <tbody class="bg-white divide-y divide-gray-200" id="leads-table-body">
                                    <!-- Rows injected by JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-white shadow mt-8 p-4 text-center text-gray-500 text-sm">
        &copy; 2026 Autonomous SDR Lead Finder Agent
    </footer>
</body>
</html>
